spring.application.name=spring-boot-lesson-01
# 未指定 active profile 时，Spring 加载 application-mysql.properties。
spring.profiles.default=mysql
server.address=127.0.0.1

# 两种模式都由 SQL 建表，Hibernate 在启动时校验映射。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false
springdoc.api-docs.enabled=false

spring.security.user.name=lesson
spring.security.user.password=${LESSON_INFO_PASSWORD:${random.uuid}}
