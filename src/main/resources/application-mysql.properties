server.port=8080
# 从项目根目录读取本机 .env，连接 Compose 映射到本机的 MySQL 端口。
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/${MYSQL_DATABASE:spring_boot_lesson}
spring.datasource.username=${MYSQL_USER:spring_lesson}
spring.datasource.password=${MYSQL_PASSWORD}
