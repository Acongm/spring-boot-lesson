server.port=8082
# 本地文件库会保留练习数据。启动测试用独立的内存库覆盖这个 URL。
spring.datasource.url=jdbc:h2:file:./.local-db/lesson;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 启动时应用 db/migration 中尚未执行的版本。
spring.flyway.enabled=true

management.endpoint.health.probes.enabled=true
# readiness 同时检查应用是否接收请求及数据源是否可用。
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=${spring.application.name}
springdoc.api-docs.enabled=true
